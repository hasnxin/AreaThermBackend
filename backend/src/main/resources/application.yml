spring:
  application:
    name: areatherm-backend
  profiles:
    active: local
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: simple

server:
  port: 8080
  error:
    include-message: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

areatherm:
  jwt:
    # Local/dev-only default secret -- override via AREATHERM_JWT_SECRET env var
    # for anything beyond a laptop. Never committed as a real secret.
    secret: ${AREATHERM_JWT_SECRET:dev-only-secret-change-me-areatherm-backend-local-use-only-0123456789}
    expiration-minutes: 120
  async:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 100
